@if (isPlaying) {
  <button
    class="btn audio-control__button"
    [attr.aria-label]="isMuted ? 'Désactiver le son' : 'Activer le son'"
    [attr.aria-pressed]="isMuted ? 'true' : 'false'"
    (click)="toggleAudio()"
    tabindex="0"
  >
    @if (isMuted) {
      <fa-icon [icon]="faVolumeXmark"></fa-icon>
    } @else {
      <fa-icon [icon]="faVolumeHigh"></fa-icon>
    }
  </button>
  @if (showKeyboardHint) {
    <span class="audio-control__keyboard-hint">
      Raccourci clavier: 'M' pour activer/désactiver le son
    </span>
  }
}
