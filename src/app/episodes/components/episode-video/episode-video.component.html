<div #playerContainer id="player-container" [class.active]="!videoEnded"></div>

@if (videoEnded) {
  <nav class="episode-video__nav">
    <a id="go-to-quiz-btn" class="btn btn-plain" [routerLink]="['../quiz']">
      Lancer le quiz !
    </a>
    <a class="btn btn-plain" (click)="restartVideo()">
      <fa-icon [icon]="faArrowRotateLeft"></fa-icon>
      Revoir toute la vidéo
    </a>
    <a class="btn btn-plain" (click)="goToPedagogicalConcept()">
      <fa-icon [icon]="faArrowRotateLeft"></fa-icon>
      Revoir le concept pédagogique
    </a>
  </nav>
}
